name = "rag-blog-api"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "http://localhost:3000"
API_URL = "https://rag-blog-api.guidopasto05.workers.dev"
WEB_ORIGIN = "http://localhost:3000"

# Placeholder bindings — replace IDs after provisioning Cloudflare resources.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "523981c7e71c48cda689a56cf3fb783a"
localConnectionString = "postgres://user:pass@localhost:5432/rag_blog"

# R2 disabled for now (enable in Cloudflare Dashboard + uncomment when ready):
# [[r2_buckets]]
# binding = "BLOG_IMAGES"
# bucket_name = "rag-blog-images"
# preview_bucket_name = "rag-blog-images-preview"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c83f61e2a5144a8c83b680d4bca32e1a"
preview_id = "d9a974e2452d4778bcbb0c80a7b9ccb5"

[[queues.producers]]
binding = "RAG_INDEX_QUEUE"
queue = "rag-index-queue"

[[queues.consumers]]
queue = "rag-index-queue"
max_batch_size = 5
max_retries = 3

[ai]
binding = "AI"
